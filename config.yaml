data:
  datasets_root: dataset        # Input videos, organized by scene/platform
  frames_root: frames
  output_root: outputs/coalitions
  scenes: null                  # null = all scenes under the input root of each stage
  platforms: [Car, Drone, Pedestrian]
  # platforms: [Drone]
  device: auto                  # auto | cpu | cuda

# extraction:
#   strategy: fps                # fps | optical_flow | hybrid
#   optical_flow:
#     mode_threshold_px: 80      # Select when modal displacement from last selected frame >= Mth
#     mode_bin_width_px: 1       # Histogram bin width; zero displacement stays zero
#     block_size: 180
#     block_stride: 270
#     search_radius: 300         # Search +/- this many original-resolution pixels on each axis
#     keep_last: true            # Always include the final frame, even below Mth
#   fps: 2                      # Fixed sampling, or hybrid fallback after 1/fps video seconds
#   format: jpg                  # jpg | png
#   threads: 1                   # FFmpeg threads; videos are processed sequentially

resources:
  bank:                         # pairs + matching bank (GPU)
    gpus: 1                     # count, or list of indices: [0, 1]
    threads: 4                  # CPU cores per task
  sfm:                          # SfM (CPU only)
    workers: 12                  # parallel coalitions; 0 = automatic
    threads: 12                  # threads per coalition
  mvs:                          # MVS (GPU)
    gpus: 1                     # count, or list of indices: [0, 1, 2, 3]
    threads: 4                  # CPU cores per task

mvs:
  enabled: true
  max_image_size: 1024
  cache_gb: 2.0
  num_sources: 10

defaults:
  execution:                  # Override any operation inside an experiment
    global: {batch_size: 1, workers: 1, loader_workers: 2, prefetch: 8}
    local: {batch_size: 1, workers: 1, loader_workers: 2, prefetch: 8}
    matching: {batch_size: 1, workers: 1, loader_workers: 2, prefetch: 8}
    dense: {batch_size: 1, workers: 1, loader_workers: 2, prefetch: 8}
  global_feature: netvlad
  top_k: 20
  sequential_window: 0
  max_keypoints: 4096
  resize_max: 1024
  camera_mode: PER_FOLDER
  seed: 0

experiments:
  - {name: sift,   preset: sift}
  # - {name: sp-sg,  preset: sp-sg}
  # - {name: mast3r-aerialmd, preset: mast3r-aerialmd}
  # - name: sp-sg-k40-seq5
  #   preset: sp-sg
  #   top_k: 40
  #   sequential_window: 5
  #   mvs: false

