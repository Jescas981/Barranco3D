data:
  frames_root: frames
  output_root: outputs/coalitions
  scenes: null                  # null = all folders under frames_root
  platforms: [Car, Drone, Pedestrian]
  device: auto                  # auto | cpu | cuda

resources:
  bank:                         # pairs + matching bank (GPU)
    gpus: 1                     # count, or list of indices: [0, 1]
    threads: 4                  # CPU cores per task
  sfm:                          # SfM (CPU only)
    workers: 0                  # parallel coalitions; 0 = automatic
    threads: 6                  # threads per coalition
  mvs:                          # MVS (GPU)
    gpus: 4                     # count, or list of indices: [0, 1, 2, 3]
    threads: 4                  # CPU cores per task

mvs:
  enabled: true
  colmap: colmap
  max_image_size: 1024
  cache_gb: 2.0
  num_sources: 10

defaults:
  global_feature: netvlad
  top_k: 20
  sequential_window: 0
  max_keypoints: 4096
  resize_max: 1024
  camera_mode: PER_FOLDER
  seed: 0

experiments:
  - {name: sift,   preset: sift}
  - {name: sp-sg,  preset: sp-sg}
  - {name: mast3r, preset: mast3r}
  - name: sp-sg-k40-seq5
    preset: sp-sg
    top_k: 40
    sequential_window: 5
    mvs: false
